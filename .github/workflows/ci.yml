name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Postgres real, no mocks — mismo criterio que tests/integration/ (ver AGENTS.md).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal_proyectos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://portal:portal@localhost:5432/portal_proyectos
      JWT_SECRET: ci-secret-de-prueba-no-real-min-32-caracteres
      NODE_ENV: test
      PORT: 48500
      FRONTEND_URL: http://localhost:39173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run migrate:up

      - run: npm test
